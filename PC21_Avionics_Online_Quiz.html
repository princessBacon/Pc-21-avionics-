<h1>PC-21 Avionics Practice Quiz</h1><p class="muted">Reusable offline quiz based on your uploaded PDF. The source does not provide an MCQ answer key, so MCQs are self-marked. FIB answers are taken from the PDF.</p>

<script>const bank=[{"id": "M1", "type": "mcq", "q": "The _________ automates the tasks of managing onboard Navigation Systems.", "opts": ["ILS", "PMS", "DMS", "FMS"]}, {"id": "M2", "type": "mcq", "q": "The FMS has __________ Line Select Keys (LSKs)", "opts": ["6 (3 on each side)", "8 (4 on each side)", "12 (6 on each side)", "15 (6 on each side and 3 on the bottom)"]}, {"id": "M3", "type": "mcq", "q": "The FMS display and controls and located _____________", "opts": ["In the front cockpit right console only", "In both cockpits right console", "On the front cockpit ELEC panel", "On both cockpit MFDs"]}, {"id": "M4", "type": "mcq", "q": "The FMS receives its primary power from the _____________", "opts": ["BATT DIRECT bus", "BATT bus", "MISSION bus", "FMS bus"]}, {"id": "M5", "type": "mcq", "q": "Which of the following is not a function of the PC-21 FMS?", "opts": ["RNAV", "Back-up radio, navigation and transponder tuning", "Back-up audio volume controller", "Back-up mission data computer (MDC)"]}, {"id": "M6", "type": "mcq", "q": "The FMS installed in the aircraft has suﬃcient memory to store ___________", "opts": ["2 databases", "3 databases", "1 current and 2 out of date databases for comparision", "4 databases"]}, {"id": "M7", "type": "mcq", "q": "The FMS screen is a _____________", "opts": ["Two inch by four inch monochromatic high intensity display", "Four inch by four inch monochromatic high intensity display", "Four inch by four inch colour liquid crystal display", "Two inch by four inch colour liquid crystal display"]}, {"id": "M8", "type": "mcq", "q": "Where are the keyboard entries displayed before pressing the appropriate LSK?", "opts": ["Scriptpad", "Scratchpad", "Scriptscreen", "Scratchscreen"]}, {"id": "M9", "type": "mcq", "q": "The CLR key on the FMS is used to _____________", "opts": ["Delete, digit by digit, scratchpad data", "Clear LSK selected entries", "Clear screen contents", "Set the composite lighting relay"]}, {"id": "M10", "type": "mcq", "q": "The _____________ annunciator is illuminated whenever the BIT detects a malfunction of the FMS", "opts": ["MSG", "FMS WARN", "MALF", "FAIL"]}, {"id": "M11", "type": "mcq", "q": "The radar altimeter is valid up to a height above ground of _____________ feet", "opts": ["2,500", "3,500", "4,500", "5,500"]}, {"id": "M12", "type": "mcq", "q": "The radar altimeter antenna beam width permits operation of up to _____________ in roll and _____________ in pitch", "opts": ["+/- 30 (roll), +/- 30 (pitch)", "+/- 45 (roll, +/- 30 (pitch)", "+/- 45 (roll), +/- 45 (pitch)", "+/- 60 (roll), +/- 45 (pitch)"]}, {"id": "M13", "type": "mcq", "q": "HOTAS controls are located _____________", "opts": ["On the control column and throttle", "On the up front control panel", "On the right console", "On the TAD and stick"]}, {"id": "M14", "type": "mcq", "q": "Which of the following is NOT a HOTAS control column switch?", "opts": ["Boresight / declutter switch", "Multi-function selector switch", "Roll / pitch trim switch", "Yaw / trim switch"]}, {"id": "M15", "type": "mcq", "q": "Which of the following is NOT a HOTAS throttle switch?", "opts": ["Press to transmit switch", "Airbrake switch", "Boresight / declutter switch", "Slew control"]}, {"id": "M16", "type": "mcq", "q": "Select the normal airbrake switch position.", "opts": ["Spring loaded toward rear", "Spring loaded toward forward", "Spring loaded to centre", "Spring loaded and locked"]}, {"id": "M17", "type": "mcq", "q": "What COMM selections are accessible to a pilot using the PTT switch?", "opts": ["COM2 only", "COM3 only", "COM2 and COM3", "COM1 and COM2"]}, {"id": "M18", "type": "mcq", "q": "The Trim Aid Device provides _____________ based on inputs from the yaw trim switches located on the HOTAS.", "opts": ["Manual Rudder Trim", "Automatic Rudder Trim", "Manual aileron Trim", "Automatic aileron Trim"]}, {"id": "M19", "type": "mcq", "q": "The mission computer is turned on by the mission switch located on the _____________", "opts": ["MISSION panel on the left console of the Front Cockpit", "ELEC panel on the right console of the Front Cockpit", "UFCP", "FMS panel on the right console of either Cockpit"]}, {"id": "M20", "type": "mcq", "q": "Which of the following is NOT a function of the mission computer?", "opts": ["Control of the retractable footstep", "System displays", "Health and usage monitoring system (HUMS) display", "Heads up display"]}, {"id": "M21", "type": "mcq", "q": "The mission computer receives power from the _____________", "opts": ["BATT bus", "GEN 1 bus", "GEN 2 bus", "MISSION bus"]}, {"id": "M22", "type": "mcq", "q": "Select the location of the avionics system OAT sensor.", "opts": ["Right wing", "Windscreen", "Left wing", "Empennage"]}, {"id": "M23", "type": "mcq", "q": "The PC-21 navigation flight data system includes how many pitot-static sensors?", "opts": ["One pitot tube and one static vent", "One pitot tube and two static vents", "Two pitot tubes and one static vent", "Two pitot tubes and two static vents"]}, {"id": "M24", "type": "mcq", "q": "With regard to flight data sensors, if the _____________ has not been turned on and the OAT is below _____________, an ICE caution is shown on the MFD", "opts": ["ANTI-ICE Switch, 0 deg C", "ANTI-ICE Switch, 4 deg C", "PROBES Switch, 0 deg C", "PROBES switch, 4 deg C"]}, {"id": "M25", "type": "mcq", "q": "The Decision Height setting is normally used during _____________ to prevent the pilot from descending below a minimum height", "opts": ["Initial approach", "Initial taxi", "Final approach", "Takeoﬀ"]}, {"id": "M26", "type": "mcq", "q": "The roles of the MFD soft keys are dependent on the display show EXCEPT for the _____________ bezel, which retains the same functions at all times.", "opts": ["Lower horizontal", "Upper horizontal", "Left vertical", "Right vertical"]}, {"id": "M27", "type": "mcq", "q": "Pressing an MFD soft key with a legend that is boxed will _____________ and/or return the display to the previously selected page in case of the selection keys.", "opts": ["Move to the next page of the displayed function", "Increase or decrease brightness by one increment", "Repeat the function of the opposite MFD", "Deselect the function"]}, {"id": "M28", "type": "mcq", "q": "What type of information does the STS page display?", "opts": ["ENS and hybrid position information", "INS and hybrid salvage status", "GPS and hybrid salvage status", "GPS, INS, and hybrid position information"]}, {"id": "M29", "type": "mcq", "q": "In what manner are values displayed on the HYD page for the main hydraulic system?", "opts": ["Analogue only", "Digital only", "Analogue and digital", "Digital and measurable"]}, {"id": "M30", "type": "mcq", "q": "Which of the following MFD pages is NOT included in the SYS master mode pages?", "opts": ["STS", "FUEL", "ECS", "COMM"]}, {"id": "M31", "type": "mcq", "q": "Which of the following is NOT a main component of the PC-21 communication systems?", "opts": ["AMU", "UHF/VHF Transreceiver", "Mode S Transponder", "HUMS"]}, {"id": "M32", "type": "mcq", "q": "What is the secondary interface for communication monitoring and control?", "opts": ["AMS", "SMS", "FMS", "LMS"]}, {"id": "M33", "type": "mcq", "q": "What switch on the throttle can be used to communicate?", "opts": ["PTT", "PTI", "PTA", "PTS"]}, {"id": "M34", "type": "mcq", "q": "The _____________ communication status is monitored by the FMS", "opts": ["Transducer", "Transponder", "Responder", "Receiver"]}, {"id": "M35", "type": "mcq", "q": "To calculate position, the ____ uses VOR bearing information in conjunction with TACAN/DME range and is also a backup to GPS and TACAN/DME.", "opts": ["PFD", "SFD", "FMS", "UFCP"]}, {"id": "M36", "type": "mcq", "q": "The _____ receiver receives transmissions from the NAVSTAR GPS satellite constellation.", "opts": ["GPS", "INS", "GNSSU", "IRS"]}, {"id": "M37", "type": "mcq", "q": "When power is applied, and if a valid initialisation signal is received, the GNSSU takes approximately ____ to achieve the Time-To-First-Fix (TTFF) stage.", "opts": ["60s", "75s", "90s", "120"]}, {"id": "M39", "type": "mcq", "q": "THE UFCP is the primary means of pilot control over the ___ functions.", "opts": ["FMS", "MC", "PFD", "MFD"]}, {"id": "M40", "type": "mcq", "q": "The Front Cockpit UFCP has an extra ____, which is no found on the Rear Cockpit UFCP", "opts": ["Scratchpad", "MMS Key", "ODS Key", "Rotary Control Switch"]}, {"id": "M41", "type": "mcq", "q": "Which of the following is NOT a UFCP rotary control switch?", "opts": ["COM1 radio volume", "UFCP brightness", "COM2 radio volume", "MC brightness"]}, {"id": "M42", "type": "mcq", "q": "On the UFCP, a chevron inside a(n) ____ indicates that there is a further layer containing additional functionality", "opts": ["Scratchpad window", "ODS window", "AOA indexer", "MMS indicator"]}, {"id": "M43", "type": "mcq", "q": "If an MMS key is pressed while that mode is already active, the UFCP will ____, provided no other UFCP key was pressed between the MMS key selections.", "opts": ["Revert to the previously active mode", "Go to STBY (for that function only)", "Go to STBY (for all functions)", "Rotate to next active mode"]}, {"id": "M44", "type": "mcq", "q": "Pressing the BACK key removes all unconfirmed entries from the scratchpad and _____.", "opts": ["Reverts to previous confirmed Scratchpad entry", "Selects Backup NAV mode", "Uses SFD data", "Selects the previous UFCP page"]}, {"id": "M45", "type": "mcq", "q": "What is the maximum number of frequency formats that can be displayed on the UFCP?", "opts": ["Five", "Two", "Three", "Four"]}, {"id": "M46", "type": "mcq", "q": "The ____ uses the UFCP as a control interface during normal operation.", "opts": ["TPDA", "TFDR", "TPDR", "TPOR"]}, {"id": "M47", "type": "mcq", "q": "An ____ Channel Board Failure will generate a warning on the MFDs.", "opts": ["AMS", "ANU", "AME", "AMU"]}, {"id": "M48", "type": "mcq", "q": "If the UFCP fails, the transponder can be controlled by the ____.", "opts": ["MC", "FMS", "AMU", "MFD"]}, {"id": "M49", "type": "mcq", "q": "What capability is only activated within the TPDR when the aircraft is airborne?", "opts": ["Emergency CAM Selector", "Emergency Code Selector", "Emergency Code Receiver", "Emgency CAM receiver"]}, {"id": "M50", "type": "mcq", "q": "Select the location of the VOR/ILS Antenna Set.", "opts": ["Fuselage", "Vertical Stabiliser", "Left Wing", "Right Wing"]}, {"id": "M51", "type": "mcq", "q": "The primary control for the VOR/ILS and TACAN/DME radio navigation aids is the _____.", "opts": ["UFCP", "FMS", "AMR", "AMS"]}, {"id": "M52", "type": "mcq", "q": "Which of the following does NOT receive attitude and direction reference from the IRS?", "opts": ["PFD", "SFD", "HUD", "FMS"]}, {"id": "M53", "type": "mcq", "q": "What frequency band does the VOR Navigation System use?", "opts": ["UHF", "HF", "SHF", "VHF"]}, {"id": "M54", "type": "mcq", "q": "Secondary Control of the VOR/ILS is through the _____.", "opts": ["Comm Panel", "MFD INST page", "UFCP", "FMS"]}, {"id": "M55", "type": "mcq", "q": "What is the maximum number of frequency formats that can be displayed on the UFCP?", "opts": ["Five", "Two", "Three", "Four"]}, {"id": "M56", "type": "mcq", "q": "The ____ uses the UFCP as a control interface during normal operation.", "opts": ["TPDA", "TFDR", "TPDR", "TPOR"]}, {"id": "M57", "type": "mcq", "q": "An ____ Channel Board Failure will generate a warning on the MFDs.", "opts": ["AMS", "ANU", "AME", "AMU"]}, {"id": "M58", "type": "mcq", "q": "If the UFCP fails, the transponder can be controlled by the ____.", "opts": ["MC", "FMS", "AMU", "MFD"]}, {"id": "M59", "type": "mcq", "q": "What capability is only activated within the TPDR when the aircraft is airbone?", "opts": ["Emergency CAM Selector", "Emergency Code Selector", "Emergency Code Receiver", "Emergency CAM Receiver"]}, {"id": "M60", "type": "mcq", "q": "Select the location of the VOR/ILS Antenna Set.", "opts": ["Fuselage", "Vertical Stabiliser", "Left Wing", "Right Wing"]}, {"id": "M61", "type": "mcq", "q": "The primary control for the VOR/ILS and TACAN/DME radio navigation aids is the ____.", "opts": ["UFCP", "FMS", "AMR", "AMS"]}, {"id": "M62", "type": "mcq", "q": "Which of the following does NOT receive attitude and direction reference from the IRS?", "opts": ["PFD", "SFD", "HUD", "FMS"]}, {"id": "M63", "type": "mcq", "q": "What frequency band does the VOR Navigation System use?", "opts": ["UHF", "HF", "SHF", "VHF"]}, {"id": "M64", "type": "mcq", "q": "Secondary Control the VOR/ILS is through the ____.", "opts": ["Comm Panel", "MFD INST page", "UFCP", "FMS"]}, {"id": "F1", "type": "fib", "q": "Two _____ by ______ colour MFDs are installed in _______, one either side of the PFD.", "answer": "6 inch, 8 inch, each cockpit"}, {"id": "F2", "type": "fib", "q": "The MFDs have _________ soft keys on each vertical bezel and _______ soft keys on each horizontal bezel.", "answer": "7, 5"}, {"id": "F3", "type": "fib", "q": "Power is selected to all MFDs through the ______ on the ______ on the right console in the front cockpit.", "answer": "Avionics master switch, ELEC control panel"}, {"id": "F4", "type": "fib", "q": "The right MFD displays in each cockpit are powered from the _____ and the left MFD displays from the _____.", "answer": "BATT BUS, GEN 1 BUS"}, {"id": "F5", "type": "fib", "q": "The 26 MFD pages are contained in ______ sections.", "answer": "6"}, {"id": "F6", "type": "fib", "q": "A ___ pages is displayed in the student cockpit when a simulated failed MFD is activated from the instructor page.", "answer": "blank"}, {"id": "F7", "type": "fib", "q": "The radio communication system can operate a maximum of ___ separate transceivers.", "answer": "2"}, {"id": "F8", "type": "fib", "q": "The audio management unit is connected to the ____ and ______.", "answer": "MC, FMS"}, {"id": "F9", "type": "fib", "q": "________ seconds must elapse during continuous PTT operation, before AMU disables it as a stuck switch.", "answer": "45"}, {"id": "F10", "type": "fib", "q": "The radio navigation system provides the flight crew with an awareness of the aircraft position relative to ______ beacons.", "answer": "Ground (and air based)"}, {"id": "F11", "type": "fib", "q": "During normal operation the primary means of controlling the COM, VOR/ILS, DME is the ______ via the UFCP.", "answer": "MC"}, {"id": "F12", "type": "fib", "q": "An OAT sensor on the lower surface of the left wing measure the ______ of the external air.", "answer": "Temperature or Total Air Temperature"}, {"id": "F13", "type": "fib", "q": "Radar altimeter data are reported on the _____ and ________.", "answer": "PFD, HUD"}, {"id": "F14", "type": "fib", "q": "The ______ routes all HOTAS mission related inputs.", "answer": "RIOC"}, {"id": "F15", "type": "fib", "q": "The _______ transfers trim controls for roll, pitch, and yaw directly to the appropriate trim actuators.", "answer": "HOTAS"}, {"id": "F16", "type": "fib", "q": "The ______ provides automatic inputs to reduce the need for the pilot to correct rudder trim manually under varying flight conditions.", "answer": "TAD"}, {"id": "F17", "type": "fib", "q": "The HOTAS _____ switch has _____ positions and is located on the throttle and is used for external communication.", "answer": "PTT, 3"}, {"id": "F18", "type": "fib", "q": "The HOTAS roll/pitch trim switch has _____ directional positions away from the centre and is located on the ______.", "answer": "Four, control column"}, {"id": "F19", "type": "fib", "q": "The HOTAS ____ and ______ control functions are available when the MC is oﬄine.", "answer": "Airbrake, trimming"}, {"id": "F20", "type": "fib", "q": "The FMS provides a complete ______ and _______ navigation solution for world-wide 4D aircraft nav in the oceanic/remote region, en-route, terminal phases of flight and non-precision approach.", "answer": "Global and area"}, {"id": "F21", "type": "fib", "q": "The FMS provides level 1 _____ nav which is the required nav performance(RNP) for all en- route, terminal and approach phases of flight.", "answer": "civil"}, {"id": "F22", "type": "fib", "q": "The FMS DME/ DME performance is restricted by one or a combination of the following factors: low altitude, mountainous terrain, _____ and _______.", "answer": "Extreme pitch angle, extreme roll angle"}, {"id": "F23", "type": "fib", "q": "The FMS nav database must be updated every ________.", "answer": "28"}, {"id": "F24", "type": "fib", "q": "One function of the FMS scratchpad is to display _____ messages.", "answer": "Status advisory"}, {"id": "F25", "type": "fib", "q": "_______ function keys are used to access specific pages of the FMS.", "answer": "15"}, {"id": "F26", "type": "fib", "q": "The Radio Communication System can operate a maximum of ______ separate transceivers.", "answer": "Two"}, {"id": "F27", "type": "fib", "q": "The Audio Management Unit is connected to the ______ and the ______.", "answer": "MC,FMS"}, {"id": "F28", "type": "fib", "q": "______ seconds must elapse during continuous PTT operation, before the AMU disables it as a stuck switch.", "answer": "45"}, {"id": "F29", "type": "fib", "q": "The radio navigation system provides the flight crew with an awareness of the aircraft position relative to ______ beacons.", "answer": "Ground (and air based)"}, {"id": "F30", "type": "fib", "q": "When TACAN is the selected navigation mode, the ______ is the sole control of the TACAN/DME channel A.", "answer": "UFCP"}, {"id": "F31", "type": "fib", "q": "The GNSSU is capable of providing for aircraft position and velocity data in ______ dimensions.", "answer": "Three"}, {"id": "F32", "type": "fib", "q": "The controls and displays on the two (Front and Rear Cockpit) UFCPs are ______.", "answer": "Identical (the same)"}, {"id": "F33", "type": "fib", "q": "The Rear Cockpit UFCP is a diﬀerent ______ than the Front Cockpit UFCP, and it does not have a HUD brightness control.", "answer": "Shape"}, {"id": "F34", "type": "fib", "q": "______ data on the UFCP is entered, edited, and cleared through use of the 12-key keypad.", "answer": "Scratchpad"}];let current=[];const $=x=>document.getElementById(x);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function norm(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function start(){let mode=$('mode').value;current=bank.filter(q=>mode==='both'||q.type===mode);if($('shuffle').checked)current=shuffle(current);$('questions').replaceChildren();$('status').textContent=current.length+' questions. You can restart as many times as you want.';current.forEach((q,i)=>{let el=document.createElement('section');el.className='question';let h=document.createElement('div');h.textContent=(i+1)+'. '+q.q;el.append(h);if(q.type==='mcq'){let opts=$('shuffleOptions').checked?shuffle(q.opts):q.opts;let div=document.createElement('div');div.className='opts';opts.forEach((o,j)=>{let label=document.createElement('label'),inp=document.createElement('input');inp.type='radio';inp.name='q'+i;inp.value=o;label.append(inp,document.createTextNode(' '+String.fromCharCode(65+j)+'. '+o));div.append(label)});el.append(div);let note=document.createElement('div');note.className='muted';note.textContent='MCQ answer key not supplied. Use your notes to self-check.';el.append(note)}else{let inp=document.createElement('input');inp.type='text';inp.placeholder='Type answer(s), separated by commas';el.append(inp);let check=document.createElement('button');check.textContent='Check answer';let result=document.createElement('div');result.className='muted';check.onclick=()=>{let expected=q.answer.split(',').map(norm),actual=inp.value.split(',').map(norm);result.textContent=JSON.stringify(expected)===JSON.stringify(actual)?'Matches source answer':'Not an exact match. Reveal answer to compare.'};el.append(check,result)}let btn=document.createElement('button');btn.textContent='Show source answer';let ans=document.createElement('div');ans.className='answer hidden';ans.textContent=q.type==='fib'?q.answer:'No verified answer key in source PDF';btn.onclick=()=>{ans.classList.toggle('hidden');btn.textContent=ans.classList.contains('hidden')?'Show source answer':'Hide answer'};el.append(btn,ans);$('questions').append(el)})}
$('start').onclick=start;$('reveal').onclick=()=>document.querySelectorAll('.answer').forEach(x=>x.classList.remove('hidden'));start();</script></html>
